# 这里刻意**不写** -Dfile.encoding=UTF-8。
#
# 原因：Gradle 把单元测试的类路径写进一个 @argfile 交给测试工作进程，写的时候用
# daemon 的默认字符集，而 JDK 的 java 启动器是按**系统 ANSI 码页**去读那个文件的。
# 本机码页是 GBK，项目路径又含中文（D:\DSH工作），两边一旦不一致，
# 路径里的中文就会被读坏，测试任务报 "ClassNotFoundException: ...测试类"，
# 而同样的测试用 java -cp 手工跑却完全正常 —— 非常难查。
# 去掉这个参数后两边都用平台码页，就对上了（顺带控制台中文也不再是乱码）。
org.gradle.jvmargs=-Xmx2048m
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
android.overridePathCheck=true
